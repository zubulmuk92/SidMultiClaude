name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # .npmrc applique --omit=optional et --ignore-scripts
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:int
      - run: npm run vendor-audit
